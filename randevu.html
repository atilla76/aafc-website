<style>
:root{--ink:#12101E;--ink2:#1C1929;--ink3:#252233;--gold:#B89A6A;--goldlt:#D4B896;--cream:#F5F1EB;--mid:rgba(245,241,235,.62);--dim:rgba(245,241,235,.38);--line:rgba(255,255,255,.08);--green:#3AB06A;--red:#C0614A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px calc(40px + env(safe-area-inset-bottom))}
.brand{font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:600}
h1{font-size:24px;font-weight:600;margin-top:10px;line-height:1.25}
.sub{color:var(--mid);font-size:14px;margin-top:4px}
.intro{color:var(--mid);font-size:14px;margin-top:14px;line-height:1.5;white-space:pre-line}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.step{font-size:11px;letter-spacing:1.5px;color:var(--gold);font-weight:600;text-transform:uppercase;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.step .chg{color:var(--mid);font-size:12px;letter-spacing:0;text-transform:none;cursor:pointer;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--ink);cursor:pointer;font-size:15px;color:var(--cream);text-align:left;font-family:inherit;width:100%}
.opt small{color:var(--dim);font-size:12px}
.opt.sel{border-color:var(--gold);background:rgba(184,154,106,.12)}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 64px;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--ink);text-align:center;cursor:pointer;color:var(--cream);font-family:inherit}
.day .w{font-size:11px;color:var(--dim)}.day .d{font-size:20px;font-weight:600;margin:2px 0}.day .m{font-size:11px;color:var(--mid)}
.day.sel{border-color:var(--gold);background:rgba(184,154,106,.14)}
.day.sel .w,.day.sel .m{color:var(--goldlt)}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.time{padding:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--cream);font-size:15px;cursor:pointer;font-family:inherit}
.time.sel{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
label{display:block;font-size:12px;color:var(--mid);margin:12px 0 6px}
input,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:var(--cream);font-size:16px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:70px}
.btn{width:100%;margin-top:16px;padding:15px;border:none;border-radius:12px;background:var(--gold);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn.wa{background:#25D366;color:#0b2f17}
.muted{color:var(--dim);font-size:13px;text-align:center;padding:14px 0}
.err{color:var(--red);font-size:13px;margin-top:10px}
.sum{display:flex;flex-direction:column;gap:6px;font-size:15px}
.sum span{color:var(--mid)}
.ok{text-align:center;padding:10px 0}
.ok .tick{width:64px;height:64px;border-radius:50%;background:rgba(58,176,106,.15);color:var(--green);font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.foot{margin-top:28px;text-align:center;color:var(--dim);font-size:11px}
.foot a{color:var(--dim)}
.hp{position:absolute;left:-9999px;opacity:0}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
@keyframes s{to{transform:rotate(360deg)}}
html.light{--ink:#FFFFFF;--ink2:#F7F5F1;--ink3:#EEEAE3;--gold:#9A7B4C;--goldlt:#7A5F36;--cream:#1C1929;--mid:rgba(28,25,41,.68);--dim:rgba(28,25,41,.45);--line:rgba(0,0,0,.10)}
html.light .time.sel{color:#fff}html.light .btn{color:#fff}
html.embed,html.embed body{background:transparent}
html.embed .wrap{padding:8px 4px 12px}
</style>

  ru: { cta: 'Нет удобного времени? Запишитесь в лист ожидания', title: 'Лист ожидания', sub: (d) => `Сообщим, если на ${d} освободится время.`, any: 'Подойдёт и другой день', note: 'Пожелание (напр. после обеда)', join: 'Записаться', done: 'Вы в листе ожидания. Мы свяжемся с вами, когда освободится время.' },
  ko: { cta: '원하는 시간이 없나요? 대기 명단에 등록하세요', title: '대기 명단', sub: (d) => `${d}에 자리가 나면 알려 드릴게요.`, any: '다른 날도 괜찮아요', note: '희망 사항 (예: 오후)', join: '등록하기', done: '대기 명단에 등록되었습니다. 자리가 나면 연락드리겠습니다.' },
  zh: { cta: '没有合适的时间？加入候补名单', title: '候补名单', sub: (d) => `如果 ${d} 有空位，我们会通知您。`, any: '其他日期也可以', note: '偏好（如：下午）', join: '加入名单', done: '您已加入候补名单，有空位时我们会联系您。' },
};
const LANGS = { tr: TR, en: EN, de: DE, es: ES, fr: FR, it: IT, pt: PT, ru: RU, ko: KO, zh: ZH };
const LOCALES = { tr: 'tr-TR', en: 'en-GB', de: 'de-DE', es: 'es-ES', fr: 'fr-FR', it: 'it-IT', pt: 'pt-PT', ru: 'ru-RU', ko: 'ko-KR', zh: 'zh-CN' };
const LC = (() => {
  const q = (new URLSearchParams(location.search).get('lang') || '').slice(0, 2).toLowerCase();
  if (LANGS[q]) return q;
  for (const l of (navigator.languages || [navigator.language || 'tr'])) { const c = String(l).slice(0, 2).toLowerCase(); if (LANGS[c]) return c; }
  return 'tr';
})();
const L = LANGS[LC];
const W = WL[LC] || WL.en;
const locale = LOCALES[LC];
document.documentElement.lang = LC;
document.title = L.title;

const st = { info: null, service: null, days: [], date: null, times: [], time: null, busy: false, err: '', result: null, wl: false, wlDone: false };
const app = document.getElementById('app');
if (document.documentElement.classList.contains('embed') && window.parent !== window) {
  const post = () => window.parent.postMessage({ aafcBooking: slug, h: Math.ceil(document.body.getBoundingClientRect().height) }, '*');
  new ResizeObserver(post).observe(document.body); window.addEventListener('load', post);
}

async function rpc(fn, body) {
  const r = await fetch(`${SU}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SK, Authorization: `Bearer ${SK}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (iso, opts) => new Date(iso + 'T12:00:00').toLocaleDateString(locale, opts);
const longDate = (iso) => fmtDate(iso, { weekday: 'long', day: 'numeric', month: 'long' });

async function init() {
  if (!slug) return notFound();
  try {
    st.info = await rpc('booking_info', { p_slug: slug });
  } catch (e) { st.info = null; }
  if (!st.info) return notFound();
  document.title = `${L.title} · ${st.info.name || ''}`;
  if ((st.info.services || []).length === 1) await pickService(0, true);
  render();
}

function notFound() { app.innerHTML = `<div class="brand">AAFC</div><div class="card"><div class="muted">${L.notFound}</div></div>`; }

async function pickService(i, silent) {
  st.service = st.info.services[i];
  st.date = null; st.time = null; st.times = []; st.days = null;
  if (!silent) render();
  st.days = await rpc('booking_days', { p_slug: slug, p_service: st.service.name }).catch(() => []);
  if (st.days.length) await pickDate(st.days[0], true);
  render();
}

async function pickDate(d, silent) {
  st.date = d; st.time = null; st.times = null;
  if (!silent) render();
  st.times = await rpc('booking_slots', { p_slug: slug, p_date: d, p_service: st.service.name }).catch(() => []);
  if (!silent) render();
}

function pickTime(t) { st.time = t; st.err = ''; render(); setTimeout(() => document.getElementById('nm')?.focus(), 50); }

async function doBook(ev) {
  ev.preventDefault();
  if (st.busy) return;
  const f = ev.target;
  if (f.website.value) return; // honeypot
  st.busy = true; st.err = ''; render(true);
  try {
    const r = await rpc('booking_create', {
      p_slug: slug, p_date: st.date, p_time: st.time, p_service: st.service.name,
      p_name: f.nm.value, p_phone: f.ph.value, p_note: f.nt.value || null,
    });
    if (r && r.ok) {
      st.result = { ...r, name: f.nm.value.trim() };
    } else {
      st.err = L.errors[r?.error] || L.errors.generic;
      if (r?.error === 'taken') {
        st.time = null;
        st.times = await rpc('booking_slots', { p_slug: slug, p_date: st.date, p_service: st.service.name }).catch(() => []);
      }
    }
  } catch (e) { st.err = L.errors.generic; }
  st.busy = false; render();
}

async function doWait(ev) {
  ev.preventDefault();
  if (st.busy) return;
  const f = ev.target;
  if (f.website.value) return;
  st.busy = true; st.err = ''; render();
  try {
    const any = document.getElementById('wa')?.checked;
    const r = await rpc('booking_waitlist_join', {
      p_slug: slug, p_service: st.service?.name || null, p_date: any ? null : (st.date || null),
      p_name: f.wn.value, p_phone: f.wp.value, p_note: f.wt.value || null, p_lang: LC,
    });
    if (r && r.ok) { st.wl = false; st.wlDone = true; }
    else st.err = L.errors[r?.error] || L.errors.generic;
  } catch (e) { st.err = L.errors.generic; }
  st.busy = false; render();
}

function icsHref() {
  const r = st.result, i = st.info;
  const start = r.date.replaceAll('-', '') + 'T' + r.time.replace(':', '') + '00';
  const endD = new Date(`${r.date}T${r.time}:00`); endD.setMinutes(endD.getMinutes() + (r.duration || 30));
  const p = (n) => String(n).padStart(2, '0');
  const end = `${endD.getFullYear()}${p(endD.getMonth() + 1)}${p(endD.getDate())}T${p(endD.getHours())}${p(endD.getMinutes())}00`;
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//AAFC//Booking//TR', 'BEGIN:VEVENT', `UID:${r.id}@aafclinic.com`,
    `DTSTART:${start}`, `DTEND:${end}`, `SUMMARY:${st.service.name} - ${i.name || ''}`,
    `LOCATION:${(i.address || '').replace(/\n/g, ' ')}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
}

function waHref() {
  let d = String(st.info.phone || '').replace(/\D/g, '');
  if (d.length === 11 && d.startsWith('0')) d = '9' + d;
  if (d.length === 10 && d.startsWith('5')) d = '90' + d;
  return `https://wa.me/${d}?text=${encodeURIComponent(L.waMsg(st.result.name, st.service.name, longDate(st.result.date), st.result.time))}`;
}

function render(keepForm) {
  const i = st.info;
  let h = `<div class="brand">${esc((i.speciality || 'AAFC').toLocaleUpperCase('tr'))}</div>
    <h1>${esc(i.name || '')}</h1>
    ${i.doctor ? `<div class="sub">${esc(i.doctor)}</div>` : ''}
    ${i.address ? `<div class="sub">${esc(i.address)}</div>` : ''}
    ${i.intro ? `<div class="intro">${esc(i.intro)}</div>` : ''}`;

  if (st.result) {
    const r = st.result;
    h += `<div class="card ok"><div class="tick">✓</div><h1 style="font-size:20px">${L.done}</h1>
      <div class="sub" style="margin-top:8px">${esc(st.service.name)}</div>
      <div style="font-size:18px;margin-top:6px;font-weight:600">${esc(longDate(r.date))} · ${esc(r.time)}</div>
      <div class="sub" style="margin-top:10px">${L.doneSub}</div>
      ${i.phone ? `<a class="btn wa" style="display:block;text-decoration:none" href="${waHref()}" target="_blank" rel="noopener">${L.wa}</a>` : ''}
      <a class="btn ghost" style="display:block;text-decoration:none" href="${icsHref()}" download="randevu.ics">${L.cal}</a>
      </div>`;
    if (r.intake) {
      const c = FORM_CTA[LC] || FORM_CTA.en, q = new URLSearchParams(location.search);
      const fu = `form?t=${encodeURIComponent(r.intake)}&lang=${LC}${q.get('theme') ? '&theme=' + encodeURIComponent(q.get('theme')) : ''}${q.get('embed') ? '&embed=1' : ''}`;
      h += `<div class="card" style="border-color:var(--gold)"><div class="step">${c[0]}</div><div class="sub" style="margin-top:0">${c[1]}</div>
        <a class="btn" style="display:block;text-decoration:none;text-align:center" href="${fu}">${c[2]}</a></div>`;
    }
    app.innerHTML = h + foot();
    return;
  }

  // 1) service
  const svcs = i.services || [];
  if (!st.service || svcs.length > 1 && !st.service) {
    h += `<div class="card"><div class="step">1 · ${L.service}</div><div class="opts">${svcs.map((s, k) =>
      `<button class="opt" onclick="pickService(${k})"><span>${esc(s.name)}</span><small>${s.duration} ${L.min}</small></button>`).join('')}</div></div>`;
  } else {
    h += `<div class="card"><div class="step"><span>1 · ${esc(st.service.name)} · ${st.service.duration} ${L.min}</span>
      ${svcs.length > 1 ? `<span class="chg" onclick="st.service=null;st.result=null;render()">${L.change}</span>` : ''}</div></div>`;

    // 2) date + time
    h += `<div class="card"><div class="step">2 · ${L.date}</div>`;
    if (st.days === null) h += `<div class="spin"></div>`;
    else if (!st.days.length) h += `<div class="muted">${L.noDays}</div>`;
    else {
      h += `<div class="days">${st.days.map((d) => `<button class="day ${d === st.date ? 'sel' : ''}" onclick="pickDate('${d}')">
        <div class="w">${esc(fmtDate(d, { weekday: 'short' }))}</div><div class="d">${Number(d.slice(8))}</div>
        <div class="m">${esc(fmtDate(d, { month: 'short' }))}</div></button>`).join('')}</div>`;
      if (st.times === null) h += `<div class="spin"></div>`;
      else if (!st.times.length) h += `<div class="muted">${L.noTimes}</div>`;
      else h += `<div class="times">${st.times.map((t) => `<button class="time ${t === st.time ? 'sel' : ''}" onclick="pickTime('${t}')">${t}</button>`).join('')}</div>`;
    }
    if (!st.wl && !st.wlDone && st.days !== null && st.times !== null)
      h += `<div class="muted" style="padding-bottom:0"><a href="#" style="color:var(--goldlt)" onclick="st.wl=true;st.time=null;render();return false">${W.cta}</a></div>`;
    h += `</div>`;
    if (st.wlDone) h += `<div class="card"><div class="muted" style="color:var(--green)">✓ ${W.done}</div></div>`;
    else if (st.wl) {
      h += `<div class="card"><div class="step"><span>${W.title}</span><span class="chg" onclick="st.wl=false;render()">✕</span></div>
        ${st.date ? `<div class="sub" style="margin-top:0">${esc(W.sub(longDate(st.date)))}</div>` : ''}
        <form onsubmit="doWait(event)" autocomplete="on">
          <input class="hp" name="website" tabindex="-1" autocomplete="off">
          <label for="wn">${L.name}</label><input id="wn" name="wn" autocomplete="name" required minlength="3" maxlength="80">
          <label for="wp">${L.phone}</label><input id="wp" name="wp" type="tel" inputmode="tel" autocomplete="tel" required placeholder="${LC === 'tr' ? '05xx xxx xx xx' : '+'}">
          <label for="wt">${W.note}</label><input id="wt" name="wt" maxlength="300">
          ${st.date ? `<label style="display:flex;gap:8px;align-items:center;color:var(--cream);font-size:14px;margin-top:14px"><input type="checkbox" id="wa" style="width:20px;height:20px;margin:0"> ${W.any}</label>` : ''}
          ${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}
          <button class="btn" ${st.busy ? 'disabled' : ''}>${st.busy ? L.loading : W.join}</button>
          <div class="muted" style="padding-bottom:0">${L.kvkk}</div>
        </form></div>`;
    }

    // 3) details
    if (st.time) {
      h += `<div class="card"><div class="step">3 · ${L.info}</div>
        <div class="sum"><div>${esc(longDate(st.date))} · <b>${esc(st.time)}</b></div></div>
        <form onsubmit="doBook(event)" autocomplete="on">
          <input class="hp" name="website" tabindex="-1" autocomplete="off">
          <label for="nm">${L.name}</label><input id="nm" name="nm" autocomplete="name" required minlength="3" maxlength="80">
          <label for="ph">${L.phone}</label><input id="ph" name="ph" type="tel" inputmode="tel" autocomplete="tel" required placeholder="${LC === 'tr' ? '05xx xxx xx xx' : '+'}">
          <label for="nt">${L.note}</label><textarea id="nt" name="nt" maxlength="300"></textarea>
          ${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}
          <button class="btn" ${st.busy ? 'disabled' : ''}>${st.busy ? L.loading : L.book}</button>
          <div class="muted" style="padding-bottom:0">${L.kvkk}</div>
        </form></div>`;
    } else if (st.err) {
      h += `<div class="card"><div class="err">${esc(st.err)}</div></div>`;
    }
  }
  // keep typed values across re-render
  const keep = {};
  for (const k of ['nm', 'ph', 'nt', 'wn', 'wp', 'wt']) if (document.getElementById(k)) keep[k] = document.getElementById(k).value;
  const wa = document.getElementById('wa')?.checked;
  app.innerHTML = h + foot();
  for (const k in keep) { const el = document.getElementById(k); if (el) el.value = keep[k]; }
  if (wa && document.getElementById('wa')) document.getElementById('wa').checked = true;
}

function foot() {
  const i = st.info || {};
  return `<div class="foot">${i.phone ? `<a href="tel:${esc(String(i.phone).replace(/\s/g, ''))}">${L.call}: ${esc(i.phone)}</a> · ` : ''}AAFC</div>`;
}

init();
</script>
</body>
</html>
