*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
html.embed,html.embed body{background:transparent}
.wrap{max-width:600px;margin:0 auto;padding:24px 16px calc(40px + env(safe-area-inset-bottom))}
.brand{font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:600}
h1{font-size:24px;font-weight:600;margin-top:10px;line-height:1.25}
.sub{color:var(--mid);font-size:14px;margin-top:6px;line-height:1.5}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:16px;padding:6px 16px;margin-top:16px}
.q{padding:14px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:none}
.q.miss .qt{color:var(--red)}
.qt{font-size:15px;line-height:1.45}
.yn{display:flex;gap:8px;margin-top:10px}
.yn button{flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--line);background:var(--ink);color:var(--cream);font-size:15px;cursor:pointer;font-family:inherit}
.yn button.sel.y{background:rgba(192,97,74,.16);border-color:var(--red);color:var(--red);font-weight:600}
.yn button.sel.n{background:rgba(58,176,106,.14);border-color:var(--green);color:var(--green);font-weight:600}
input,textarea{width:100%;margin-top:10px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--cream);font-size:16px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:80px}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--mid);line-height:1.5;margin-top:16px;cursor:pointer}
.chk input{width:22px;height:22px;margin:0;flex:0 0 22px;accent-color:var(--gold)}
.btn{width:100%;margin-top:16px;padding:15px;border:none;border-radius:12px;background:var(--gold);color:var(--ink);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit}
html.light .btn{color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--red);font-size:14px;margin-top:12px}
.ok{text-align:center;padding:22px 0}
.ok .tick{width:64px;height:64px;border-radius:50%;background:rgba(58,176,106,.15);color:var(--green);font-size:34px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.foot{margin-top:28px;text-align:center;color:var(--dim);font-size:11px}
.foot a{color:var(--dim)}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>

const LC = (() => {
  const q = (new URLSearchParams(location.search).get('lang') || '').slice(0, 2).toLowerCase();
  if (LANGS[q]) return q;
  for (const l of (navigator.languages || [navigator.language || 'tr'])) { const c = String(l).slice(0, 2).toLowerCase(); if (LANGS[c]) return c; }
  return 'tr';
})();
const L = LANGS[LC];
document.documentElement.lang = LC;
document.title = L.title;

const app = document.getElementById('app');
const st = { info: null, ans: {}, det: {}, note: '', ok: false, busy: false, err: '', miss: [], consent: false, done: false };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

if (document.documentElement.classList.contains('embed') && window.parent !== window) {
  const post = () => window.parent.postMessage({ aafcBooking: 'intake', aafcIntake: 1, h: Math.ceil(document.body.getBoundingClientRect().height) }, '*');
  new ResizeObserver(post).observe(document.body);
}

async function rpc(fn, body) {
  const r = await fetch(`${SU}/rest/v1/rpc/${fn}`, {
    method: 'POST', headers: { apikey: SK, Authorization: `Bearer ${SK}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}

function head() {
  const i = st.info || {};
  return `<div class="brand">${esc((i.clinic || 'AAFC').toLocaleUpperCase(LC === 'tr' ? 'tr' : undefined))}</div><h1>${L.title}</h1>`;
}
function foot() {
  const i = st.info || {};
  return `<div class="foot">${i.phone ? `<a href="tel:${esc(String(i.phone).replace(/\s/g, ''))}">${L.call}: ${esc(i.phone)}</a> · ` : ''}AAFC</div>`;
}
function msg(t, tick) {
  app.innerHTML = head() + `<div class="card ok">${tick ? '<div class="tick">✓</div>' : ''}<div class="sub" style="font-size:15px">${t}</div></div>` + foot();
}

async function init() {
  if (!TOKEN) return msg(L.notFound);
  try { st.info = await rpc('intake_info', { p_token: TOKEN }); } catch (e) { st.info = null; }
  if (!st.info) return msg(L.notFound);
  if (st.info.status === 'completed') return msg(L.completed, true);
  if (st.info.status === 'expired') return msg(L.expired);
  render();
}

function setAns(k, v) { st.ans[k] = v; st.miss = st.miss.filter((x) => x !== k); if (!st.miss.length && st.err === L.errMissing) st.err = ''; render(); }

function render() {
  if (st.done) {
    app.innerHTML = head() + `<div class="card ok"><div class="tick">✓</div><h1 style="font-size:20px">${L.done}</h1><div class="sub">${L.doneSub}</div></div>` + foot();
    return;
  }
  // keep typed text
  document.querySelectorAll('[data-det]').forEach((el) => { st.det[el.dataset.det] = el.value; });
  const nt = document.getElementById('nt'); if (nt) st.note = nt.value;
  const ck = document.getElementById('ck'); if (ck) st.consent = ck.checked;

  let h = head() + `<div class="sub" style="margin-top:10px">${esc(L.hi(st.info.first_name))}<br>${L.intro}</div><div class="card">`;
  for (const [k, hasD] of QS) {
    const v = st.ans[k];
    h += `<div class="q ${st.miss.includes(k) ? 'miss' : ''}" id="q_${k}"><div class="qt">${L.q[k]}</div>
      <div class="yn"><button type="button" class="y ${v === 'yes' ? 'sel' : ''}" onclick="setAns('${k}','yes')">${L.yes}</button>
      <button type="button" class="n ${v === 'no' ? 'sel' : ''}" onclick="setAns('${k}','no')">${L.no}</button></div>
      ${hasD && v === 'yes' ? `<input data-det="${k}" maxlength="300" placeholder="${esc(L.d[k] || L.detail)}" value="${esc(st.det[k] || '')}">` : ''}</div>`;
  }
  h += `<div class="q"><div class="qt">${L.note}</div><textarea id="nt" maxlength="1000">${esc(st.note)}</textarea></div></div>
    <label class="chk"><input type="checkbox" id="ck" ${st.consent ? 'checked' : ''}><span>${L.consent}</span></label>
    ${st.err ? `<div class="err">${esc(st.err)}</div>` : ''}
    <button class="btn" onclick="submitForm()" ${st.busy ? 'disabled' : ''}>${st.busy ? L.sending : L.submit}</button>`;
  app.innerHTML = h + foot();
}

async function submitForm() {
  if (st.busy) return;
  render(); // sync typed values into state
  st.miss = QS.map(([k]) => k).filter((k) => !st.ans[k]);
  if (st.miss.length) {
    st.err = L.errMissing; render();
    document.getElementById('q_' + st.miss[0])?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (!st.consent) { st.err = L.errConsent; render(); return; }
  const answers = { ...st.ans, note: st.note };
  for (const [k, hasD] of QS) if (hasD && st.ans[k] === 'yes' && st.det[k]) answers[k + '_detail'] = st.det[k];
  st.busy = true; st.err = ''; render();
  try {
    const r = await rpc('intake_submit', { p_token: TOKEN, p_answers: answers, p_lang: LC });
    st.busy = false;
    if (r && r.ok) { st.done = true; render(); window.scrollTo(0, 0); return; }
    if (r?.error === 'completed') return msg(L.completed, true);
    if (r?.error === 'expired') return msg(L.expired);
    st.err = L.generic;
  } catch (e) { st.busy = false; st.err = L.generic; }
  render();
}

init();
</script>
</body>
</html>
