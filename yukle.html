<!DOCTYPE html>

<style>
:root{--ink:#12101E;--ink2:#1C1929;--ink3:#26223A;--gold:#B89A6A;--goldlt:#D4B896;--cream:#F5F1EB;--mid:rgba(245,241,235,.62);--dim:rgba(245,241,235,.38);--line:rgba(255,255,255,.08);--green:#5FB58A;--red:#E06C6C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px calc(40px + env(safe-area-inset-bottom))}
.brand{font-size:12px;letter-spacing:3px;color:var(--gold);font-weight:600}
h1{font-size:24px;font-weight:600;margin-top:10px}
.sub{color:var(--mid);font-size:14px;margin-top:8px;line-height:1.55}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}
.step{font-size:11px;letter-spacing:1.4px;color:var(--mid);font-weight:600;text-transform:uppercase;margin-bottom:10px}
.drop{border:1.5px dashed rgba(184,154,106,.45);border-radius:16px;padding:26px 14px;text-align:center;transition:.15s}
.drop.on{background:rgba(184,154,106,.10);border-color:var(--gold)}
.drop .big{font-size:15px;font-weight:600}
.drop .hint{color:var(--dim);font-size:12.5px;margin-top:6px;line-height:1.5}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid rgba(255,255,255,.16)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:12px;color:var(--dim)}
.bar{height:4px;border-radius:2px;background:var(--ink3);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.st{font-size:12px;font-weight:700;white-space:nowrap}
.st.ok{color:var(--green)}.st.err{color:var(--red)}.st.wait{color:var(--dim)}.st.up{color:var(--goldlt)}
.x{background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;padding:0 4px}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.sum .t{color:var(--mid);font-size:12.5px}
.okbox{background:rgba(95,181,138,.10);border:1px solid rgba(95,181,138,.35);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.5;margin-top:12px;display:none}
.lock{display:flex;gap:10px;align-items:flex-start;color:var(--mid);font-size:12.5px;line-height:1.55}
.lock svg{flex:none;margin-top:2px}
.muted{color:var(--dim);font-size:13px;text-align:center;padding:14px 0;line-height:1.5}
.foot{margin-top:28px;text-align:center;color:var(--dim);font-size:11px;line-height:1.7}
.spin{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>

const LOCALES = { tr: 'tr-TR', en: 'en-GB', de: 'de-DE', es: 'es-ES', fr: 'fr-FR', it: 'it-IT', pt: 'pt-PT', ru: 'ru-RU', ko: 'ko-KR', zh: 'zh-CN' };
const LC = (() => {
  const q = (new URLSearchParams(location.search).get('lang') || '').slice(0, 2).toLowerCase();
  if (LANGS[q]) return q;
  for (const l of (navigator.languages || [navigator.language || 'tr'])) { const c = String(l).slice(0, 2).toLowerCase(); if (LANGS[c]) return c; }
  return 'tr';
})();
const L = LANGS[LC];
document.documentElement.lang = LC;
document.title = L.title;
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (iso) => { try { return new Date(iso).toLocaleString(LOCALES[LC], { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return iso; } };
const fmtSize = (b) => { b = Number(b) || 0; const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return (i ? b.toFixed(b < 10 ? 1 : 0) : b) + ' ' + u[i]; };

let INFO = null;
const Q = [];          // { file, name, state: wait|up|ok|err, pct, err }
let running = false;

async function call(body) {
  const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ t: TOKEN }, body)), cache: 'no-store' });
  let d = {}; try { d = await r.json(); } catch (e) { /* ignore */ }
  return d;
}

function head() { return `<div class="brand">${esc(((INFO && INFO.clinic) || 'AAFC').toLocaleUpperCase(LC === 'tr' ? 'tr' : undefined))}</div><h1>${L.title}</h1>`; }
function msg(t) { app.innerHTML = head() + `<div class="card"><div class="muted">${t}</div></div><div class="foot">AAFC · aafclinic.com</div>`; }

async function init() {
  if (!TOKEN) return msg(L.notFound);
  try { INFO = await call({ action: 'info' }); } catch (e) { return msg(L.error); }
  if (!INFO || INFO.status !== 'ok') { const s = INFO && INFO.status; INFO = null; return msg(s === 'expired' ? L.expired : s === 'revoked' ? L.revoked : s === 'error' ? L.error : L.notFound); }
  render();
}

const LOCK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B89A6A" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';

function render() {
  const prev = (INFO.files || []);
  app.innerHTML = head() +
    `<div class="sub">${esc(L.intro(INFO.clinic || 'AAFC'))}</div>
    <div class="card">
      <div class="drop" id="drop"><div class="big">${L.drop}</div><div class="hint">${L.dropHint}</div>
        <div class="btns"><button class="btn gold" id="bFiles">${L.files}</button><button class="btn ghost" id="bDir">${L.folder}</button></div></div>
      <div id="qbox" style="display:none;margin-top:14px"><div class="step">${L.queue}</div><div id="qlist"></div>
        <div class="sum"><span class="t" id="qsum"></span><button class="btn gold" id="bStart">${L.start}</button></div></div>
      <div class="okbox" id="okbox">${L.allDone}</div>
    </div>
    ${prev.length ? `<div class="card"><div class="step">${L.previous}</div>${prev.map((f) => `<div class="row"><div class="nm"><b>${esc(f.name)}</b><span>${fmtSize(f.size)}</span></div><span class="st ok">✓</span></div>`).join('')}</div>` : ''}
    <div class="card"><div class="lock">${LOCK}<div>${L.secure}<br>${esc(L.valid(fmtDate(INFO.expires_at)))}</div></div></div>
    <div class="foot">AAFC · aafclinic.com</div>`;
  const fi = document.getElementById('inFiles'), di = document.getElementById('inDir');
  document.getElementById('bFiles').onclick = () => fi.click();
  document.getElementById('bDir').onclick = () => di.click();
  fi.onchange = () => { add(fi.files); fi.value = ''; };
  di.onchange = () => { add(di.files); di.value = ''; };
  document.getElementById('bStart').onclick = start;
  const d = document.getElementById('drop');
  d.addEventListener('dragover', (e) => { e.preventDefault(); d.classList.add('on'); });
  d.addEventListener('dragleave', () => d.classList.remove('on'));
  d.addEventListener('drop', async (e) => { e.preventDefault(); d.classList.remove('on'); add(await dropped(e.dataTransfer)); });
}

// folders dropped: walk the entries so the relative path is kept
async function dropped(dt) {
  const items = Array.from(dt.items || []).map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!items.length) return Array.from(dt.files || []);
  const out = [];
  async function walk(entry, path) {
    if (entry.isFile) {
      const f = await new Promise((res, rej) => entry.file(res, rej));
      out.push({ file: f, name: path + f.name });
    } else if (entry.isDirectory) {
      const r = entry.createReader();
      let batch;
      do { batch = await new Promise((res, rej) => r.readEntries(res, rej)); for (const e of batch) await walk(e, path + entry.name + '/'); } while (batch.length);
    }
  }
  for (const e of items) await walk(e, '');
  return out;
}

function add(list) {
  for (const x of Array.from(list || [])) {
    const file = x.file || x, name = x.name || file.webkitRelativePath || file.name;
    if (/(^|\/)(\.|__MACOSX\/|Thumbs\.db$|desktop\.ini$)/i.test(name)) continue;
    if (Q.some((q) => q.name === name && q.file.size === file.size)) continue;
    const it = { file, name, state: 'wait', pct: 0, err: '' };
    if (!file.size) { it.state = 'err'; it.err = L.empty; } else if (file.size > MAX_FILE) { it.state = 'err'; it.err = L.tooBig; }
    Q.push(it);
  }
  document.getElementById('okbox').style.display = 'none';
  drawQ();
}

function drawQ() {
  const box = document.getElementById('qbox');
  if (!box) return;
  box.style.display = Q.length ? 'block' : 'none';
  document.getElementById('qlist').innerHTML = Q.map((q, i) => {
    const st = q.state === 'ok' ? `<span class="st ok">✓ ${L.done}</span>` : q.state === 'err' ? `<span class="st err">${esc(q.err || L.failed)}</span>` :
      q.state === 'up' ? `<span class="st up">${q.pct}%</span>` : `<span class="st wait">${L.waiting}</span>`;
    const rm = !running && q.state !== 'ok' ? `<button class="x" onclick="rm(${i})" aria-label="×">×</button>` : '';
    return `<div class="row"><div class="nm"><b>${esc(q.name)}</b><span>${fmtSize(q.file.size)}</span>${q.state === 'up' ? `<div class="bar"><i style="width:${q.pct}%"></i></div>` : ''}</div>${st}${rm}</div>`;
  }).join('');
  const todo = Q.filter((q) => q.state === 'wait' || (q.state === 'err' && q.retry));
  document.getElementById('qsum').textContent = L.total(Q.length, fmtSize(Q.reduce((a, q) => a + q.file.size, 0)));
  const b = document.getElementById('bStart');
  b.disabled = running || !todo.length;
  b.textContent = Q.some((q) => q.state === 'err' && q.retry) && !Q.some((q) => q.state === 'wait') ? L.retry : L.start;
}
function rm(i) { Q.splice(i, 1); drawQ(); }

function put(url, blob, onProg) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('Content-Type', 'application/octet-stream');
    x.setRequestHeader('x-upsert', 'true');
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProg(e.loaded); };
    x.onload = () => (x.status >= 200 && x.status < 300 ? res() : rej(new Error('http ' + x.status)));
    x.onerror = () => rej(new Error('network'));
    x.send(blob);
  });
}

async function uploadOne(q) {
  q.state = 'up'; q.pct = 0; q.err = ''; drawQ();
  const parts = Math.max(1, Math.ceil(q.file.size / PART));
  if (!q.id) {
    const b = await call({ action: 'begin', name: q.name, size: q.file.size, parts });
    if (b.status !== 'ok') throw Object.assign(new Error(b.status), { fatal: ['quota', 'too_big', 'expired', 'revoked', 'not_found'].includes(b.status) });
    q.id = b.id; q.doneParts = 0;
  }
  for (let p = q.doneParts + 1; p <= parts; p++) {
    const from = (p - 1) * PART, blob = q.file.slice(from, Math.min(q.file.size, from + PART));
    let ok = false, lastErr = null;
    for (let attempt = 0; attempt < 3 && !ok; attempt++) {
      try {
        const s = await call({ action: 'part', id: q.id, part: p });
        if (s.status !== 'ok') throw Object.assign(new Error(s.status), { fatal: s.status !== 'error' });
        await put(s.url, blob, (n) => { q.pct = Math.min(99, Math.floor((from + n) / q.file.size * 100)); drawQ(); });
        ok = true;
      } catch (e) { lastErr = e; if (e.fatal) break; await new Promise((r) => setTimeout(r, 1500 * (attempt + 1))); }
    }
    if (!ok) throw lastErr;
    q.doneParts = p;
  }
  const d = await call({ action: 'done', id: q.id });
  if (d.status !== 'ok') throw new Error(d.status);
  q.state = 'ok'; q.pct = 100; drawQ();
}

async function start() {
  if (running) return;
  running = true;
  for (const q of Q) if (q.state === 'err' && q.retry) { q.state = 'wait'; q.retry = false; }
  drawQ();
  const todo = Q.filter((q) => q.state === 'wait');
  let i = 0;
  async function worker() {
    while (i < todo.length) {
      const q = todo[i++];
      try { await uploadOne(q); }
      catch (e) {
        const s = e && e.message;
        q.state = 'err';
        q.err = s === 'quota' ? L.quota : s === 'too_big' ? L.tooBig : s === 'expired' ? L.expired : s === 'revoked' ? L.revoked : L.failed;
        q.retry = !(e && e.fatal);
        drawQ();
      }
    }
  }
  await Promise.all([worker(), worker()]);
  running = false;
  drawQ();
  if (Q.length && Q.every((q) => q.state === 'ok' || (q.state === 'err' && !q.retry && q.err === L.empty))) document.getElementById('okbox').style.display = 'block';
}

window.addEventListener('beforeunload', (e) => { if (running) { e.preventDefault(); e.returnValue = L.leave; return L.leave; } });
init();
</script>
